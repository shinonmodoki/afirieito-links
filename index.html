<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>紹介した商品一覧</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; color: #1a1a1a; }
  h1 { font-size: 18px; text-align: center; margin: 0 0 4px; }
  .disclosure { text-align: center; font-size: 12px; color: #888; margin: 0 0 24px; }
  .list { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .card { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 10px; text-decoration: none; color: inherit; }
  .card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .info { min-width: 0; }
  .name { font-size: 13px; margin: 0 0 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { font-size: 13px; font-weight: 600; margin: 0; color: #555; }
  .code { font-size: 11px; color: #aaa; margin: 2px 0 0; }
  .empty, .error { text-align: center; color: #999; font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
  <h1>これまでご紹介した商品</h1>
  <p class="disclosure">※ 掲載リンクは全てアフィリエイト（PR）リンクです</p>
  <div class="list" id="list">
    <p class="empty">読み込み中...</p>
  </div>

  <script>
    const DATA_URL = "https://deubcejvjyfrknsipjle.supabase.co/storage/v1/object/public/public-links/data.json";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    fetch(DATA_URL, { cache: "no-store" })
      .then((res) => {
        if (!res.ok) throw new Error("読み込み失敗");
        return res.json();
      })
      .then((data) => {
        const items = data.items || [];
        const list = document.getElementById("list");
        if (items.length === 0) {
          list.innerHTML = '<p class="empty">まだ商品がありません</p>';
          return;
        }
        list.innerHTML = items
          .map(
            (item) => `
          <a class="card" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
            ${item.imageUrl ? `<img src="${escapeHtml(item.imageUrl)}" alt="" loading="lazy" />` : ""}
            <div class="info">
              <p class="name">${escapeHtml(item.name)}</p>
              <p class="price">${item.price != null ? `¥${Number(item.price).toLocaleString()}` : ""}</p>
              ${item.code ? `<p class="code">#${escapeHtml(item.code)}</p>` : ""}
            </div>
          </a>`,
          )
          .join("");
      })
      .catch(() => {
        document.getElementById("list").innerHTML =
          '<p class="error">読み込みに失敗しました</p>';
      });
  </script>
</body>
</html>
